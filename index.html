<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>You Dead</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

.author {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: red;
    font-size: 28px;
    font-weight: bold;
    z-index: 1000;
}

.text {
    position: absolute;
    color: red;
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
    text-shadow: 0 0 8px red;
}
</style>
</head>

<body>

<div class="author">by solution</div>

<script>
for (let i = 0; i < 60; i++) {

    let text = document.createElement("div");
    text.className = "text";
    text.innerText = "you dead";

    let y = Math.random() * window.innerHeight;
    let speed = 2 + Math.random() * 4;

    text.style.top = y + "px";
    text.style.left = (-200 - Math.random() * 1000) + "px";

    document.body.appendChild(text);

    let x = parseFloat(text.style.left);

    function animate() {
        x += speed;

        if (x > window.innerWidth + 100) {
            x = -200;
            text.style.top =
                Math.random() * window.innerHeight + "px";
        }

        text.style.left = x + "px";
        requestAnimationFrame(animate);
    }

    animate();
}
</script>

</body>
</html>
